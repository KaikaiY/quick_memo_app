{% load static %}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Memo</title>
  <link rel="stylesheet" href="{% static 'memos/styles.css' %}">
</head>
<body>
  <main class="app-shell">
    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <p class="message">{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'memos/menu.js' %}"></script>
</body>
</html>
