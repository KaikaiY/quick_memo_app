{% load static %}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Memo</title>
  <link rel="stylesheet" href="{% static 'memos/styles.css' %}">
</head>
<body>
  <main class="app-shell">
    <nav class="app-nav" aria-label="メイン">
      {% if user.is_authenticated %}
        <span class="app-nav-user">{{ user.username }}</span>
        <a class="app-nav-link{% if request.resolver_match.url_name == 'memo_list' %} active{% endif %}" href="{% url 'memo_list' %}">メモ</a>
        <a class="app-nav-link{% if request.resolver_match.url_name == 'nightly_review' %} active{% endif %}" href="{% url 'nightly_review' %}">夜の整理</a>
        <a class="app-nav-link{% if request.resolver_match.url_name == 'google_calendar_settings' %} active{% endif %}" href="{% url 'google_calendar_settings' %}">Google連携</a>
        <a class="app-nav-link{% if request.resolver_match.url_name == 'logout_confirm' %} active{% endif %}" href="{% url 'logout_confirm' %}">ログアウト</a>
      {% else %}
        <a class="app-nav-link{% if request.resolver_match.url_name == 'login' %} active{% endif %}" href="{% url 'login' %}">ログイン</a>
        <a class="app-nav-link{% if request.resolver_match.url_name == 'signup' %} active{% endif %}" href="{% url 'signup' %}">新規登録</a>
      {% endif %}
    </nav>
    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <p class="message">{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'memos/menu.js' %}"></script>
</body>
</html>
