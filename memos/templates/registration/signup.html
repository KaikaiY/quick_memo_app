{% extends "memos/base.html" %}

{% block content %}
<section class="quick-entry compact" aria-labelledby="signup-title">
  <div>
    <p class="eyebrow">Sign Up</p>
    <h1 id="signup-title">アカウント作成</h1>
  </div>

  <form method="post" class="memo-form auth-form">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label>
      <span>ユーザー名</span>
      {{ form.username }}
      {{ form.username.errors }}
    </label>
    <label>
      <span>パスワード</span>
      {{ form.password1 }}
      {{ form.password1.errors }}
    </label>
    <label>
      <span>パスワード確認</span>
      {{ form.password2 }}
      {{ form.password2.errors }}
    </label>
    <div class="form-actions">
      <a href="{% url 'login' %}">ログインへ</a>
      <button type="submit">作成</button>
    </div>
  </form>
</section>
{% endblock %}
